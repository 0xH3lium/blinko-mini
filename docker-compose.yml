services:
  blinko-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blinko-os
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/app.db
      NODE_OPTIONS: --max-old-space-size=220
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    mem_limit: 400m
    memswap_limit: 400m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
